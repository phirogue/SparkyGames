name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  # Cheap and fast: catches a broken reference or a stale manifest in seconds,
  # with no engine download. Runs first so an obvious mistake does not wait on
  # a 4-minute Godot job. (verify.py standard repeats this check — that is the
  # point: this job is the early signal, not a different gate.)
  propagation:
    name: Propagation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Where every change has to reach
        run: python tools/kb_check.py

  verify:
    name: verify.py standard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # THE gate, the same one that runs locally before every commit. CI used
      # to re-implement this pipeline step-by-step in YAML (and drifted from
      # it in both directions, including an `--import || true` that swallowed
      # the law-23 failure mode); tools/paths.py + GODOT_BIN is what lets one
      # script be the single source of truth for "what must pass".
      # standard = import, unit tests, boot smoke, propagation, minigame
      # bots, chaos fuzz (60 seeds).
      - name: Run the standard tier
        run: GODOT_BIN="$HOME/godot/godot" python tools/verify.py standard

  # NOT RUN IN CI, on purpose — recorded here so the gap is visible rather
  # than forgotten:
  #   * the screenshot tour and the every-quest sweep need a display and take
  #     ~20 minutes; run locally with `python tools/verify.py full`
  #   * the balance sim is long; its thresholds run in `full`, and the table
  #     still wants a human comparing it to docs/design/balance-notes.md
  #   * art generation costs money and needs an API key
  #   * the story-critic and first-timer passes are agents, not scripts —
  #     see /ownerpass
